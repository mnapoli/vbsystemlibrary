; Configuration du PHP 5.6 "legacy" qui exécute le site historique.
; Objectif : faire tourner le code de 2007 sans le modifier.

; Le code utilise abondamment les balises courtes <? ... ?>
short_open_tag = On

; Le site est encodé/servi en ISO-8859-1 (comme à l'origine). On empêche
; PHP d'imposer un charset UTF-8 dans l'en-tête Content-Type.
default_charset = "iso-8859-1"

; Injecte le shim mysql_* -> SQLite avant chaque script, sans toucher au code.
auto_prepend_file = /var/task/config/shim-mysql.php

; Chemin du fichier SQLite embarqué (surchargeable par variable d'env).
; (le shim lit VBSYSLIB_SQLITE, défini dans l'environnement d'exécution)

; Le code legacy est bruyant (notices, deprecations). On loggue sans afficher.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING & ~E_STRICT

; Fuseau par défaut (évite les warnings des fonctions de date).
date.timezone = Europe/Paris

; Uploads inutiles pour une archive en lecture seule.
file_uploads = Off
