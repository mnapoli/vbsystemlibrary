name: Deploy

# Deployment happens ONLY through this workflow (Bref Cloud).
# Nothing is deployed from a developer machine.
on:
    push:
        branches: [ main ]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        # The image compiles php-cgi 5.6 from source, so the Docker build
        # is longer than a usual Bref deploy.
        timeout-minutes: 30
        concurrency: deploy-prod
        environment:
            name: prod
        steps:
            -   uses: actions/checkout@v7

            # Node runs the Serverless Framework that Bref Cloud drives under the
            # hood, and hosts the serverless-lift plugin (CloudFront + S3 website).
            -   uses: actions/setup-node@v7
                with:
                    node-version: '18'
                    cache: 'npm'

            # Installs serverless-lift (the `website` construct in serverless.yml).
            -   run: npm ci

            -   name: Setup PHP and the Bref CLI
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
                    tools: bref/cli

            # Installs vendor/ (the bref/bref Serverless plugin used by serverless.yml).
            -   uses: ramsey/composer-install@v4
                with:
                    composer-options: '--optimize-autoloader --no-dev'

            # Builds the container image (Docker is preinstalled on the runner),
            # pushes it to ECR and updates the Lambda. Bref Cloud provides the
            # temporary AWS credentials; only BREF_TOKEN is needed here.
            -   run: bref deploy --env=prod
                env:
                    BREF_TOKEN: ${{ secrets.BREF_TOKEN }}
